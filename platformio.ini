; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Flash Configuration ---
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv

lib_deps = adafruit/Adafruit NeoPixel
           anha1/SilkyRMS@^1.0.1
; --- Critical USB Serial Flags for ESP32-S3 ---
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP_FIRMWARE_PASS=\"${sysenv.ESP_FIRMWARE_PASS}\"

Optional: If you want to use the OTA setup from the code
upload_protocol = espota
upload_port = 10.1.1.38
upload_flags =
     --port=1726
     --auth=${sysenv.ESP_FIRMWARE_PASS}
	  --host_port=16161
	  --host_ip=10.1.1.3


