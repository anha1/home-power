; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP_FIRMWARE_PASS=\"${sysenv.ESP_FIRMWARE_PASS}\"

lib_deps = adafruit/Adafruit NeoPixel
           anha1/SilkyRMS@^1.1.0
           ;symlink:///home/user/git/SilkyRMS

; --- Critical USB Serial Flags for ESP32-S3 ---


;Optional: If you want to use the OTA setup from the code

upload_protocol = espota
upload_port = 10.1.1.39
upload_flags = 
	--auth=${sysenv.ESP_FIRMWARE_PASS}
	--port=1726
	--host_port=16161
	--host_ip=10.1.1.3

